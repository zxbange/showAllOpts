name: Test and deploy main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Check authentication/configuration, or deploy this tested main commit
        type: choice
        options: [check, deploy]
        default: check

permissions:
  contents: read

# Do not interrupt an active release/rollback. Up to 100 runs can wait in this queue.
concurrency:
  group: showallopts-production
  cancel-in-progress: false
  queue: max

jobs:
  backend:
    if: github.repository == 'zxbange/showAllOpts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked backend and declared offline test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.lock.txt -r backend/requirements-dev.txt
      - name: Verify dependencies and all backend tests
        working-directory: backend
        run: |
          python -m pip check
          python -m pytest -q

  frontend:
    if: github.repository == 'zxbange/showAllOpts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: [backend, frontend]
    if: >-
      github.repository == 'zxbange/showAllOpts' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' && vars.DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'check'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production
    permissions: {}
    steps:
      # Fresh job: no project checkout, npm/pip code, caches or third-party SSH action.
      - name: Invoke restricted server entry for this exact tested SHA
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: 119.28.106.127 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINT9qOupWKUwWZw4PlmJdfC+jEkS+kzFLezUqtOg64zJ
          TESTED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]] || {
            echo 'Missing task-specific key or verified server host key.' >&2; exit 1;
          }
          umask 077
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/showallopts-ssh.XXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          ssh-keygen -F 119.28.106.127 -f "$ssh_dir/known_hosts" >/dev/null || {
            echo 'Pinned known_hosts does not cover the configured server.' >&2; exit 1;
          }
          operation="deploy $TESTED_SHA"
          if [[ "$EVENT_NAME" == workflow_dispatch && "$REQUESTED_OPERATION" == check ]]; then
            operation="check $TESTED_SHA"
          fi
          ssh -F /dev/null -T -p 22 -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            ubuntu@119.28.106.127 "$operation"
