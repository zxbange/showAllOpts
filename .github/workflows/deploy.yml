name: Test and deploy main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Check authentication/configuration, or deploy this tested main commit
        type: choice
        options: [check, deploy]
        default: check

permissions:
  contents: read

# PR checks have their own queue and never block or cancel a production release.
# Do not interrupt an active release/rollback.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('showallopts-pr-{0}', github.event.pull_request.number) || 'showallopts-production' }}
  cancel-in-progress: false
  queue: max

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    if: >-
      github.repository == 'zxbange/showAllOpts' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked backend and declared offline test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.lock.txt -r backend/requirements-dev.txt
      - name: Verify dependencies and all backend tests
        working-directory: backend
        run: |
          python -m pip check
          python -m pytest -q -p ci_shard --ci-shard=${{ matrix.shard }}/3 --durations=20

  frontend:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    if: >-
      github.repository == 'zxbange/showAllOpts' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Keep the official image version in sync with frontend/package-lock.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --shm-size=1g
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Check frontend engineering quality
        if: matrix.shard == 1
        run: npm run quality:check
      - run: npm test
      - run: npm run build
      - name: Verify the locked preinstalled browser and launch Chromium
        timeout-minutes: 2
        run: |
          node --test scripts/verify-ci-browser.test.mjs
          node scripts/verify-ci-browser.mjs
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
        id: frontend_e2e
      - name: Retain synthetic browser failure evidence
        if: failure() && steps.frontend_e2e.conclusion == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          # CI runs mocked browser tests only; live.spec.ts requires E2E_REAL_DATA=1.
          # Never include runtime folders, environment files, configs or credentials.
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/trace.zip
            frontend/test-results/**/error-context.md
          retention-days: 3
          include-hidden-files: false
          if-no-files-found: warn

  backend-quality:
    if: >-
      github.repository == 'zxbange/showAllOpts' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install backend quality dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.lock.txt -r backend/requirements-dev.txt
          python -m pip install --disable-pip-version-check -r backend/requirements-quality.txt
          python -m pip check
      - name: Check backend engineering quality
        env:
          QUALITY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$QUALITY_BASE_SHA" && "$QUALITY_BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            [[ "$QUALITY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$QUALITY_BASE_SHA^{commit}"
            args=(--base "$QUALITY_BASE_SHA")
          fi
          python backend/check_quality.py "${args[@]}"

  mysql-integration:
    if: >-
      github.repository == 'zxbange/showAllOpts' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.4', '5.7.44']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          # Disposable, fixed CI account only. No repository/production credentials.
          MYSQL_DATABASE: showallopts_ci
          MYSQL_USER: showallopts_ci
          MYSQL_PASSWORD: showallopts_ci_password
          MYSQL_ROOT_PASSWORD: showallopts_ci_root_only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent --connect-timeout=2"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked integration-test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.lock.txt -r backend/requirements-dev.txt
          python -m pip check
      - name: Require real MySQL integration tests
        env:
          SHOWALLOPTS_TEST_MYSQL: '1'
          SHOWALLOPTS_TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/integration/test_mysql_dividend.py --junitxml="$RUNNER_TEMP/mysql-tests.xml"
          python - "$RUNNER_TEMP/mysql-tests.xml" <<'PYTHON'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall(".//testcase")
          if not cases or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("Required real MySQL integration tests were not all executed.")
          PYTHON

  ci-gate:
    name: CI gate
    needs: [backend, frontend, backend-quality, mysql-integration]
    if: >-
      always() && github.repository == 'zxbange/showAllOpts' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every test and quality result
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          QUALITY_RESULT: ${{ needs.backend-quality.result }}
          MYSQL_RESULT: ${{ needs.mysql-integration.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$QUALITY_RESULT" "$MYSQL_RESULT"; do
            [[ "$result" == success ]] || { echo 'A required CI job failed, was skipped, or was cancelled.' >&2; exit 1; }
          done

  deploy:
    needs: [ci-gate]
    if: >-
      needs.ci-gate.result == 'success' &&
      github.repository == 'zxbange/showAllOpts' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' && vars.DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'check'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production
    permissions: {}
    steps:
      # Fresh job: no project checkout, npm/pip code, caches or third-party SSH action.
      - name: Invoke restricted server entry for this exact tested SHA
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: 119.28.106.127 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINT9qOupWKUwWZw4PlmJdfC+jEkS+kzFLezUqtOg64zJ
          TESTED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]] || {
            echo 'Missing task-specific key or verified server host key.' >&2; exit 1;
          }
          umask 077
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/showallopts-ssh.XXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          ssh-keygen -F 119.28.106.127 -f "$ssh_dir/known_hosts" >/dev/null || {
            echo 'Pinned known_hosts does not cover the configured server.' >&2; exit 1;
          }
          operation="deploy $TESTED_SHA"
          if [[ "$EVENT_NAME" == workflow_dispatch && "$REQUESTED_OPERATION" == check ]]; then
            operation="check $TESTED_SHA"
          fi
          ssh -F /dev/null -T -p 22 -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            ubuntu@119.28.106.127 "$operation"
