# Temporary port-80 block for FIRST certificate issuance; no login over HTTP.
# If port 80 already serves this IP, add only this location to that block instead.
server {
    listen 80;
    server_name 119.28.106.127;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
