# Native Linux deployment. Install only AFTER obtaining the certificate.
# Replace the existing site's server blocks; do not keep duplicate listeners.
server {
    listen 80;
    listen 8081;
    server_name 119.28.106.127;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://119.28.106.127$request_uri; }
}

server {
    # IP-address clients may omit SNI, so this certificate must be the default.
    listen 443 ssl default_server;
    server_name 119.28.106.127;
    ssl_certificate /etc/letsencrypt/live/showallopts-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showallopts-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    root /var/www/showallopts;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
