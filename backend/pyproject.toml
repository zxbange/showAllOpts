[project]
name = "showallopts-api"
version = "1.0.0"
description = "Read-only market research API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../collectors"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
show_error_codes = true
# Start at stable shared interfaces; expand as modules are migrated.
files = ["app/services/holdings_calendar.py", "app/services/collection_calendar.py", "app/services/collection_lifecycle.py", "app/repositories/dividend_schema.py", "app/repositories/cash_cow_snapshot.py", "app/repositories/etf_state_schema.py", "app/repositories/market_state_schema.py", "app/repositories/valuation_state_schema.py"]
