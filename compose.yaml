services:
  backend:
    build: ./backend
    # APP_ENV_FILE is resolved on the host by Compose; only its values enter the container.
    env_file: "${APP_ENV_FILE-./config/app.config}"
    environment:
      LOG_DIR: /app/log
    volumes:
      - "./log:/app/log:z"
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
